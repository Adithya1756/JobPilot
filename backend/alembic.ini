# A generic, single database configuration with async support.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# SQLAlchemy URL is set via environment (DATABASE_URL) or settings.
# Overridden by app/core/config in alembic/env.py at runtime.
sqlalchemy.url = postgresql+asyncpg://jobpilot:jobpilot_dev_password@localhost:5432/jobpilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
